<style>
:root {
  --bg: #f0f6ff;
  --blue: #1a6abf;
  --navy: #0d2144;
  --text: #0d2144;
  --text2: #3a5a8a;
  --text3: #5a7fa8;
  --border: rgba(26,106,191,0.15);
  --card: #ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Tajawal',sans-serif;
  background:linear-gradient(160deg,#e8f2ff 0%,#f0f6ff 60%,#e4eeff 100%);
  color:var(--text);min-height:100vh;overflow-x:hidden;
}

/* BACK */
.back-btn{
  position:fixed;top:20px;left:20px;z-index:100;
  background:white;border:1px solid var(--border);
  color:var(--blue);padding:10px 20px;border-radius:50px;
  font-family:'Tajawal',sans-serif;font-size:14px;
  cursor:pointer;text-decoration:none;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 2px 12px rgba(26,106,191,0.1);transition:all 0.3s;
}
.back-btn:hover{background:var(--bg);}

/* HERO */
.hero{
  text-align:center;padding:90px 20px 50px;
}
.hero-icon{font-size:72px;margin-bottom:20px;display:block;animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero-badge{
  display:inline-block;background:rgba(26,106,191,0.08);
  color:var(--blue);padding:6px 20px;border-radius:50px;
  font-size:12px;font-weight:700;letter-spacing:.15em;margin-bottom:20px;
}
.hero h1{
  font-family:'Amiri',serif;font-size:clamp(2rem,6vw,3.2rem);
  color:var(--navy);margin-bottom:16px;line-height:1.3;
}
.hero-sub{
  color:var(--text3);font-size:1.05rem;line-height:1.9;
  max-width:500px;margin:0 auto 12px;
}
.hero-warning{
  display:inline-block;
  background:rgba(180,80,40,0.08);
  color:#8b3a1a;
  border:1px solid rgba(180,80,40,0.18);
  border-radius:12px;padding:12px 22px;
  font-size:0.9rem;line-height:1.7;
  max-width:460px;margin:0 auto 36px;
}
.start-btn{
  display:inline-block;
  background:linear-gradient(135deg,var(--blue),#2a8ad4);
  color:white;padding:16px 44px;border-radius:50px;
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:1.05rem;
  text-decoration:none;cursor:pointer;border:none;
  box-shadow:0 6px 24px rgba(26,106,191,0.3);transition:all 0.3s;
}
.start-btn:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(26,106,191,0.4);}

/* GAME */
.game-wrap{max-width:700px;margin:0 auto;padding:0 20px 80px;display:none;}

/* PROGRESS */
.progress-bar-wrap{background:rgba(26,106,191,0.1);border-radius:50px;height:6px;margin-bottom:10px;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--blue),#2a8ad4);transition:width 0.5s ease;}
.progress-text{text-align:center;font-size:13px;color:var(--text3);margin-bottom:32px;}

/* QUESTION */
.q-card{
  background:var(--card);border-radius:24px;
  padding:44px 38px;box-shadow:0 8px 40px rgba(26,106,191,0.1);
  border:1px solid var(--border);animation:fadeIn .35s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.q-num{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.15em;margin-bottom:14px;}
.q-text{
  font-family:'Amiri',serif;font-size:clamp(1.25rem,3.5vw,1.6rem);
  color:var(--navy);line-height:1.65;margin-bottom:32px;
}
.options{display:flex;flex-direction:column;gap:12px;}
.opt{
  display:flex;align-items:flex-start;gap:14px;
  background:var(--bg);border:2px solid transparent;
  border-radius:16px;padding:18px 20px;cursor:pointer;
  transition:all 0.22s;font-family:'Tajawal',sans-serif;
  font-size:0.97rem;color:var(--text2);text-align:right;line-height:1.7;
}
.opt:hover{background:white;border-color:rgba(26,106,191,0.25);transform:translateX(-4px);}
.opt.selected{background:white;border-color:var(--blue);color:var(--navy);}
.opt-dot{
  width:20px;height:20px;border-radius:50%;
  border:2px solid rgba(26,106,191,0.3);
  flex-shrink:0;margin-top:2px;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.opt.selected .opt-dot{background:var(--blue);border-color:var(--blue);}
.opt.selected .opt-dot::after{content:'✓';color:white;font-size:11px;}

/* NEXT */
.next-wrap{text-align:center;margin-top:28px;}
.next-btn{
  background:linear-gradient(135deg,var(--blue),#2a8ad4);
  color:white;border:none;padding:14px 40px;border-radius:50px;
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:1rem;
  cursor:pointer;box-shadow:0 4px 18px rgba(26,106,191,0.3);
  transition:all 0.25s;opacity:0.4;pointer-events:none;
}
.next-btn.active{opacity:1;pointer-events:all;}
.next-btn.active:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(26,106,191,0.4);}

/* RESULT */
.result-wrap{display:none;max-width:700px;margin:0 auto;padding:20px 20px 80px;animation:fadeIn .5s ease;}

.result-top{
  border-radius:28px;padding:50px 40px;text-align:center;
  box-shadow:0 12px 60px rgba(0,0,0,0.14);position:relative;overflow:hidden;
}
.result-top::before{
  content:'';position:absolute;top:-80px;right:-80px;
  width:280px;height:280px;border-radius:50%;
  background:rgba(255,255,255,0.07);
}
.result-top::after{
  content:'';position:absolute;bottom:-60px;left:-60px;
  width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,0.05);
}
.result-emoji{font-size:80px;margin-bottom:18px;display:block;position:relative;z-index:1;}
.result-archetype{font-size:12px;font-weight:700;letter-spacing:.2em;opacity:.7;margin-bottom:10px;position:relative;z-index:1;}
.result-title{font-family:'Amiri',serif;font-size:clamp(1.9rem,5vw,2.8rem);font-weight:700;margin-bottom:8px;line-height:1.3;position:relative;z-index:1;}
.result-subtitle{font-family:'Amiri',serif;font-size:1.1rem;font-style:italic;opacity:.8;margin-bottom:28px;position:relative;z-index:1;}
.result-divider{width:60px;height:2px;background:rgba(255,255,255,0.35);margin:0 auto 28px;position:relative;z-index:1;}
.result-core{font-size:1.05rem;line-height:2.1;max-width:520px;margin:0 auto 28px;opacity:.92;position:relative;z-index:1;}

/* Wound sentence */
.result-sentence{
  background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
  border-radius:16px;padding:20px 24px;
  font-family:'Amiri',serif;font-size:1.15rem;font-style:italic;
  line-height:1.8;margin-bottom:28px;position:relative;z-index:1;
}
.result-sentence-label{font-size:11px;letter-spacing:.15em;opacity:.65;margin-bottom:8px;font-style:normal;font-family:'Tajawal',sans-serif;}

/* Behaviors */
.behaviors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px;position:relative;z-index:1;}
.beh{
  background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;padding:12px 16px;font-size:.88rem;line-height:1.6;
}
@media(max-width:480px){.behaviors{grid-template-columns:1fr;}}

/* Actions */
.result-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1;}
.action-btn{
  padding:13px 26px;border-radius:50px;font-family:'Tajawal',sans-serif;
  font-weight:700;font-size:.92rem;cursor:pointer;border:none;
  transition:all 0.25s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;
}
.btn-copy{background:rgba(255,255,255,0.18);color:white;border:2px solid rgba(255,255,255,0.4);}
.btn-copy:hover{background:rgba(255,255,255,0.28);}
.btn-retry{background:white;color:var(--navy);}
.btn-retry:hover{transform:translateY(-2px);}

/* After card */
.after-card{
  background:white;border-radius:20px;padding:36px 30px;
  text-align:center;margin-top:20px;
  border:1px solid var(--border);box-shadow:0 4px 20px rgba(26,106,191,0.08);
}
.after-card h3{font-family:'Amiri',serif;font-size:1.45rem;color:var(--navy);margin-bottom:12px;}
.after-card p{color:var(--text3);font-size:.95rem;line-height:1.85;margin-bottom:24px;}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.cta-a{
  padding:13px 26px;border-radius:50px;font-family:'Tajawal',sans-serif;
  font-weight:700;font-size:.9rem;text-decoration:none;transition:all .25s;
}
.cta-primary{background:linear-gradient(135deg,var(--blue),#2a8ad4);color:white;box-shadow:0 4px 14px rgba(26,106,191,0.3);}
.cta-primary:hover{transform:translateY(-2px);}
.cta-outline{border:2px solid var(--blue);color:var(--blue);}
.cta-outline:hover{background:var(--blue);color:white;}

/* Colors per archetype */
.arch-wounded{background:linear-gradient(145deg,#3a1a4a,#6b3080);}
.arch-orphan{background:linear-gradient(145deg,#1a3a5a,#2a5a8a);}
.arch-hero{background:linear-gradient(145deg,#3a1a1a,#8a2a2a);}
.arch-magical{background:linear-gradient(145deg,#1a3a3a,#2a7a6a);}
.arch-wild{background:linear-gradient(145deg,#2a3a1a,#4a7a2a);}
.arch-divine{background:linear-gradient(145deg,#2a2a1a,#7a6a1a);}

/* Toast */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0d2144;color:white;padding:12px 28px;border-radius:50px;
  font-size:14px;opacity:0;pointer-events:none;transition:all .35s;z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:480px){
  .q-card{padding:28px 20px;}
  .result-top{padding:36px 22px;}
  .result-actions{flex-direction:column;align-items:center;}
}
</style>
</head>
<body>

<a href="/game.html" class="back-btn">← العودة للتحديات</a>

<!-- HERO -->
<div class="hero" id="heroSection">
  <span class="hero-icon">🌱</span>
  <div class="hero-badge">✦ تحدي ممكنون ✦</div>
  <h1>طفلك الداخلي</h1>
  <p class="hero-sub">هناك طفل بداخلك لم يكبر — لا يزال يتخذ القرارات، يخاف، ويبحث عمّا لم يجده منذ سنوات</p>
  <p class="hero-warning">١٠ أسئلة فقط — لكن إجاباتها ستصدمك</p>
  <button class="start-btn" onclick="startGame()">ابدأ — إذا كنت مستعداً</button>
</div>

<!-- GAME -->
<div class="game-wrap" id="gameWrap">
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  <div class="progress-text" id="progressText">سؤال ١ من ١٠</div>
  <div id="questionArea"></div>
  <div class="next-wrap">
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">التالي ←</button>
  </div>
</div>

<!-- RESULT -->
<div class="result-wrap" id="resultWrap"></div>

<div class="toast" id="toast">✓ تم النسخ</div>

<script>
const Q = [
  {
    text: "عندما كنت صغيراً، ما الذي كنت تتمناه أكثر شيء؟",
    opts:[
      {t:"أن يراك أحد ويفهم ألمك دون أن تشرح",e:"W"},
      {t:"أن تجد مكاناً تنتمي إليه وأناساً لا يتركونك",e:"O"},
      {t:"أن تكون قوياً لا يستطيع أحد إيذاءك",e:"H"},
      {t:"أن يصدق أحد ما تراه وما تشعر به",e:"M"},
      {t:"أن تكون حراً تفعل ما تريد دون قيود",e:"N"},
      {t:"أن تفهم لماذا أنت مختلف عن كل من حولك",e:"D"}
    ]
  },
  {
    text: "الجملة التي كنت تحتاج أن تسمعها في طفولتك — ولم تسمعها:",
    opts:[
      {t:"\"ألمك حقيقي. أنا أراه وأنا هنا.\"",e:"W"},
      {t:"\"أنت تنتمي هنا. لن يتركك أحد.\"",e:"O"},
      {t:"\"لست مضطراً أن تكون قوياً دائماً.\"",e:"H"},
      {t:"\"ما تراه وتشعر به حقيقي، ليس خيالاً.\"",e:"M"},
      {t:"\"لا بأس أن تكون مختلفاً ومميزاً.\"",e:"N"},
      {t:"\"ما تحمله هبة، لا عبء.\"",e:"D"}
    ]
  },
  {
    text: "عندما تشعر بالألم اليوم — ماذا يفعل الطفل بداخلك؟",
    opts:[
      {t:"يصمت ويحمل كل شيء وحده دون أن يُظهر لأحد",e:"W"},
      {t:"يتساءل \"لماذا أنا دائماً وحيد في هذا؟\"",e:"O"},
      {t:"يتصلب ويقرر أنه لن ينكسر مهما حدث",e:"H"},
      {t:"يختفي إلى عالمه الداخلي بعيداً عن الجميع",e:"M"},
      {t:"يثور أو يريد الهروب من كل شيء",e:"N"},
      {t:"يشعر أن هذا الألم يحمل رسالة لم يفهمها بعد",e:"D"}
    ]
  },
  {
    text: "ما الذي تخفيه عن الناس أكثر شيء؟",
    opts:[
      {t:"عمق حزنك الحقيقي — كم أنت جريح في الداخل",e:"W"},
      {t:"كم تخاف أن يتركوك في النهاية",e:"O"},
      {t:"كم أنت تعب من الحمل وحدك",e:"H"},
      {t:"أشياء تراها وتحس بها لا تجرؤ على قولها",e:"M"},
      {t:"كم تكره القيود والتوقعات التي يضعها الناس",e:"N"},
      {t:"إحساسك أنك مختلف بطريقة لا تستطيع شرحها",e:"D"}
    ]
  },
  {
    text: "في أعمق لحظات وحدتك — ماذا يهمس لك الطفل بداخلك؟",
    opts:[
      {t:"\"لو يعلمون كم أتألم في الصمت وحدي...\"",e:"W"},
      {t:"\"لماذا أنا وحيد في النهاية دائماً؟\"",e:"O"},
      {t:"\"لن أسقط. لن أسقط أبداً.\"",e:"H"},
      {t:"\"أنا أرى ما لا يراه أحد...\"",e:"M"},
      {t:"\"أريد أن أكون حراً. فقط حراً.\"",e:"N"},
      {t:"\"أنا هنا لشيء لم يكتمل بعد.\"",e:"D"}
    ]
  },
  {
    text: "عندما ينتقدك أحد — ما الذي يحدث بداخلك فعلاً؟",
    opts:[
      {t:"تؤلمك الكلمات أكثر مما يُظهر وجهك",e:"W"},
      {t:"تتساءل إن كانوا سيبتعدون عنك بعدها",e:"O"},
      {t:"تتصلب وتقرر أنك لن تحتاجهم",e:"H"},
      {t:"تنسحب إلى عالمك الداخلي وتبتعد",e:"M"},
      {t:"تشعر بثورة داخلية أو رغبة في الاختفاء",e:"N"},
      {t:"تشعر أنهم لا يرون الصورة الكاملة",e:"D"}
    ]
  },
  {
    text: "ما الذي يجعل علاقاتك معقدة أحياناً؟",
    opts:[
      {t:"حساسيتك الشديدة لكل كلمة وكل تصرف",e:"W"},
      {t:"خوفك من الاقتراب كثيراً فيتركوك",e:"O"},
      {t:"صعوبة الاعتراف بأنك تحتاج أحداً",e:"H"},
      {t:"شعورك أن قليلاً من الناس يفهمونك حقاً",e:"M"},
      {t:"رفضك لأي شيء يشعرك بالقيد",e:"N"},
      {t:"إحساسك أنك تحمل شيئاً ثقيلاً لا يراه الآخرون",e:"D"}
    ]
  },
  {
    text: "ما الذي تبحث عنه في كل علاقة — حتى الآن؟",
    opts:[
      {t:"من يرى ألمك دون أن تحتاج لشرحه",e:"W"},
      {t:"من يبقى. ببساطة، من يبقى.",e:"O"},
      {t:"من يمنحك أماناً كافياً لتُظهر له ضعفك",e:"H"},
      {t:"من يصدق عالمك الداخلي ويفهمه",e:"M"},
      {t:"من يقبلك كما أنت دون أن يحاول تغييرك",e:"N"},
      {t:"من يرى ما تحمله ويقدّر ثقله",e:"D"}
    ]
  },
  {
    text: "الطفل بداخلك لا يزال يؤمن بشيء واحد — ما هو؟",
    opts:[
      {t:"أن الألم دليل على أنك تشعر وأنت حي",e:"W"},
      {t:"أن يوماً ما ستجد من يبقى ولا يرحل",e:"O"},
      {t:"أن الضعف خطر يجب إخفاؤه دائماً",e:"H"},
      {t:"أن هناك معنى خفياً وراء كل ما يحدث",e:"M"},
      {t:"أن القواعد التي صنعها الآخرون ليست قواعده",e:"N"},
      {t:"أنه هنا لسبب أكبر مما يظن الناس",e:"D"}
    ]
  },
  {
    text: "إذا استطعت أن تقول لطفلك الداخلي جملة واحدة الآن — ماذا ستقول؟",
    opts:[
      {t:"\"ألمك لم يكن خطأك. وأنت تستحق من يراك.\"",e:"W"},
      {t:"\"لن تكون وحيداً إلى الأبد. أنا هنا.\"",e:"O"},
      {t:"\"يمكنك أن تتعب. لا بأس. أنا أحميك الآن.\"",e:"H"},
      {t:"\"ما تراه حقيقي. لست مجنوناً.\"",e:"M"},
      {t:"\"روحك الحرة ليست مشكلة — هي هبتك.\"",e:"N"},
      {t:"\"ما تحمله ليس عبئاً — هو طريقك.\"",e:"D"}
    ]
  }
];

const ARCHETYPES = {
  W:{
    emoji:"💜",archetype:"الطفل الجريح",
    title:"يحمل الجرح بصمت",
    subtitle:"\"الألم الذي لا يُرى — أعمق الجراح\"",
    color:"arch-wounded",
    core:"طفلك الداخلي تعلّم مبكراً أن يحمل ألمه وحده. لم يجد من يرى جرحه بالكامل — فأصبح خبيراً في الصمود وإخفاء العمق. اليوم تظهر هذه القوة كحساسية شديدة، وتعاطف لا حدود له مع ألم الآخرين، وأحياناً كمسافة وقائية تضعها بين نفسك وبين من قد يؤلمونك مجدداً. جرحك لم يكن خطأك — لكنه صار طريقتك في فهم العالم.",
    behaviors:["تشعر بألم الآخرين قبل أن يتكلموا","تخفي عمق حزنك خلف وجه هادئ","تتعاطف مع كل جريح لأنك تعرف ما يشعر به","أحياناً تعطي أكثر مما تأخذ","صعب عليك طلب المساعدة","تحمل وحدك ما يعجز عنه غيرك"],
    sentence:"\"لو كانوا يعرفون كم أؤلم في الداخل...\""

let answers=[],current=0,selected=null;

function startGame(){
  document.getElementById('heroSection').style.display='none';
  document.getElementById('gameWrap').style.display='block';
  renderQ();
}
function renderQ(){
  selected=null;
  document.getElementById('nextBtn').classList.remove('active');
  const q=Q[current];
  const pct=Math.round((current/Q.length)*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressText').textContent='سؤال '+(current+1)+' من '+Q.length;
  let h='<div class="q-card">';
  h+='<div class="q-num">السؤال '+(current+1)+'</div>';
  h+='<div class="q-text">'+q.text+'</div>';
  h+='<div class="options">';
  q.opts.forEach((o,i)=>{
    h+='<div class="opt" onclick="pick(this,'+i+')" data-idx="'+i+'">';
    h+='<span class="opt-dot"></span>';
    h+='<span>'+o.t+'</span></div>';
  });
  h+='</div></div>';
  document.getElementById('questionArea').innerHTML=h;
  window.scrollTo({top:document.getElementById('gameWrap').offsetTop-20,behavior:'smooth'});
}
function pick(el,idx){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');selected=idx;
  document.getElementById('nextBtn').classList.add('active');
}
function nextQuestion(){
  if(selected===null)return;
  answers.push(Q[current].opts[selected].e);
  current++;
  if(current<Q.length){renderQ();}else{showResult();}
}
function showResult(){
  document.getElementById('gameWrap').style.display='none';
  const counts={W:0,O:0,H:0,M:0,N:0,D:0};
  answers.forEach(a=>counts[a]++);
  const winner=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  const r=ARCHETYPES[winner];

  const shareText='🌱 اكتشفت أن طفلي الداخلي هو "'+r.title+'"\n\n'+r.sentence+'\n\nاكتشف طفلك: azizasoubai.com/innerchild.html';

  let h='<div class="result-top '+r.color+'">';
  h+='<span class="result-emoji">'+r.emoji+'</span>';
  h+='<div class="result-archetype">'+r.archetype+'</div>';
  h+='<div class="result-title">'+r.title+'</div>';
  h+='<div class="result-subtitle">'+r.subtitle+'</div>';
  h+='<div class="result-divider"></div>';
  h+='<div class="result-core">'+r.core+'</div>';
  h+='<div class="result-sentence"><div class="result-sentence-label">الجملة التي لم تُسمع</div>'+r.sentence+'</div>';
  h+='<div class="behaviors">';
  r.behaviors.forEach(b=>{h+='<div class="beh">'+b+'</div>';});
  h+='</div>';
  h+='<div class="result-actions">';
  h+='<button class="action-btn btn-copy" onclick="copyResult(`'+shareText.replace(/`/g,'\\`')+'`)">📋 انسخ نتيجتك</button>';
  h+='<button class="action-btn btn-retry" onclick="retry()">🔄 أعد الاختبار</button>';
  h+='</div></div>';

  h+='<div class="after-card">';
  h+='<h3>عرفت طفلك — ماذا بعد؟</h3>';
  h+='<p>منهج ممكنون يأخذك إلى المرحلة التالية — من معرفة الجرح إلى التحرر منه والعيش بكامل حضورك</p>';
  h+='<div class="cta-row">';
  h+='<a href="/minhaj.html" class="cta-a cta-primary">اكتشف المنهج</a>';
  h+='<a href="/game.html" class="cta-a cta-outline">تحديات أخرى</a>';
  h+='</div></div>';

  const wrap=document.getElementById('resultWrap');
  wrap.innerHTML=h;wrap.style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
function copyResult(text){
  navigator.clipboard.writeText(text).then(()=>{
    const t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
  });
}
function retry(){
  answers=[];current=0;selected=null;
  document.getElementById('resultWrap').style.display='none';
  document.getElementById('gameWrap').style.display='block';
  renderQ();
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
