<style>
:root {
  --bg: #f0f6ff;

  --navy: #0d2144;

  --border: rgba(26,106,191,0.15);
  --card: #ffffff;

  --wood-bg: #f0faf2;
  --fire: #c94a1a;
  --fire-bg: #fff6f2;
  --earth: #a07820;
  --earth-bg: #fdf8ef;
  --metal: #4a6a8a;
  --metal-bg: #f2f6fa;
  --water: #1a4a8a;

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {

  background: linear-gradient(160deg, #e8f2ff 0%, #f0f6ff 60%, #e4eeff 100%);
  color: var(--text);

  overflow-x: hidden;
}

.back-btn {

  background: white; border: 1px solid var(--border);
  color: var(--blue); padding: 10px 20px; border-radius: 50px;
  font-family: 'Tajawal', sans-serif; font-size: 14px;
  cursor: pointer; text-decoration: none;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 2px 12px rgba(26,106,191,0.1); transition: all 0.3s;
}
.back-btn:hover { background: var(--bg); }

.hero {

}
.hero-icon { font-size: 72px; margin-bottom: 20px; display: block; animation: float 4s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.hero-badge {
  display: inline-block; background: rgba(26,106,191,0.08);
  color: var(--blue); padding: 6px 20px; border-radius: 50px;
  font-size: 12px; font-weight: 700; letter-spacing: .15em;
  margin-bottom: 20px;
}
.hero h1 {

  color: var(--navy); margin-bottom: 16px; line-height: 1.3;
}
.hero p {
  color: var(--text3); font-size: 1.05rem; line-height: 1.9;
  max-width: 480px; margin: 0 auto 40px;
}
.start-btn {
  display: inline-block;
  background: linear-gradient(135deg, var(--blue), #2a8ad4);
  color: white; padding: 16px 44px; border-radius: 50px;
  font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 1.05rem;
  text-decoration: none; cursor: pointer; border: none;
  box-shadow: 0 6px 24px rgba(26,106,191,0.3); transition: all 0.3s;
}
.start-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(26,106,191,0.4); }

/* GAME AREA */
.game-wrap { max-width: 680px; margin: 0 auto; padding: 0 20px 80px; display: none; }

/* PROGRESS */
.progress-bar-wrap {
  background: rgba(26,106,191,0.1); border-radius: 50px;
  height: 6px; margin-bottom: 10px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: 50px;
  background: linear-gradient(90deg, var(--blue), #2a8ad4);
  transition: width 0.5s ease;
}
.progress-text {
  text-align: center; font-size: 13px; color: var(--text3);
  margin-bottom: 32px;
}

/* QUESTION CARD */
.q-card {
  background: var(--card); border-radius: 24px;
  padding: 40px 36px; box-shadow: 0 8px 40px rgba(26,106,191,0.1);
  border: 1px solid var(--border);
  animation: fadeIn .35s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.q-num { font-size: 12px; font-weight: 700; color: var(--blue); letter-spacing:.15em; margin-bottom: 14px; }
.q-text {
  font-family: 'Amiri', serif; font-size: clamp(1.2rem,3.5vw,1.55rem);
  color: var(--navy); line-height: 1.6; margin-bottom: 30px;
}

/* OPTIONS */
.options { display: flex; flex-direction: column; gap: 12px; }
.opt {
  display: flex; align-items: center; gap: 14px;
  background: var(--bg); border: 2px solid transparent;
  border-radius: 16px; padding: 16px 20px; cursor: pointer;
  transition: all 0.22s; font-family: 'Tajawal', sans-serif;
  font-size: 0.97rem; color: var(--text2); text-align: right;
}
.opt:hover { background: white; border-color: rgba(26,106,191,0.25); transform: translateX(-4px); }
.opt.selected { background: white; border-color: var(--blue); color: var(--navy); }
.opt-icon { font-size: 1.4rem; flex-shrink: 0; }

/* NEXT BTN */
.next-wrap { text-align: center; margin-top: 28px; }
.next-btn {
  background: linear-gradient(135deg, var(--blue), #2a8ad4);
  color: white; border: none; padding: 14px 40px; border-radius: 50px;
  font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 1rem;
  cursor: pointer; box-shadow: 0 4px 18px rgba(26,106,191,0.3);
  transition: all 0.25s; opacity: 0.4; pointer-events: none;
}
.next-btn.active { opacity: 1; pointer-events: all; }
.next-btn.active:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(26,106,191,0.4); }

/* RESULT */
.result-wrap {
  display: none; max-width: 680px; margin: 0 auto; padding: 20px 20px 80px;
  animation: fadeIn .5s ease;
}
.result-card {
  border-radius: 28px; padding: 48px 40px; text-align: center;
  box-shadow: 0 12px 50px rgba(0,0,0,0.12); position: relative; overflow: hidden;
}
.result-card::before {
  content: ''; position: absolute; top: -60px; right: -60px;
  width: 220px; height: 220px; border-radius: 50%;
  background: rgba(255,255,255,0.08);

.result-emoji { font-size: 80px; margin-bottom: 20px; display: block; }
.result-label {
  font-size: 13px; font-weight: 700; letter-spacing: .2em;

.result-title {
  font-family: 'Amiri', serif; font-size: clamp(1.8rem,5vw,2.6rem);

.result-tagline {

.result-actions { display: flex; gap: 14px; justify-content: center; margin-top: 36px; flex-wrap: wrap; }

.btn-minhaj { background: var(--navy); color: white; }

.el-wood { background: linear-gradient(145deg, #1a5c28, #2d8a40); color: white; }
.el-wood .result-label { color: rgba(255,255,255,0.8); }

/* Fire */
.el-fire { background: linear-gradient(145deg, #8b2500, #c94a1a); color: white; }

/* Earth */
.el-earth { background: linear-gradient(145deg, #6b4f10, #a07820); color: white; }

/* Metal */

/* Water */
.el-water { background: linear-gradient(145deg, #0a2a5a, #1a4a8a); color: white; }

.dist-wrap { margin-top: 44px; background: rgba(0,0,0,0.15); border-radius: 20px; padding: 28px 28px; }
.dist-title { font-size: 13px; font-weight: 700; letter-spacing: .15em; opacity: .7; margin-bottom: 20px; }
.dist-row { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; }
.dist-label { font-size: 13px; font-weight: 700; width: 70px; flex-shrink: 0; opacity: .85; }
.dist-track { flex: 1; background: rgba(255,255,255,0.15); border-radius: 50px; height: 8px; overflow: hidden; }
.dist-fill { height: 100%; border-radius: 50px; background: rgba(255,255,255,0.6); transition: width 1s ease; }
.dist-pct { font-size: 12px; opacity: .7; width: 32px; text-align: left; flex-shrink: 0; }

.after-card {
  background: white; border-radius: 20px; padding: 32px 28px; text-align: center;
  margin-top: 20px; border: 1px solid var(--border);

.after-card h3 { font-family: 'Amiri', serif; font-size: 1.4rem; color: var(--navy); margin-bottom: 12px; }
.after-card p { color: var(--text3); font-size: .95rem; line-height: 1.8; margin-bottom: 20px; }
.cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.cta-a {

.cta-primary { background: linear-gradient(135deg,var(--blue),#2a8ad4); color: white; box-shadow: 0 4px 14px rgba(26,106,191,0.3); }
.cta-primary:hover { transform: translateY(-2px); }
.cta-outline { border: 2px solid var(--blue); color: var(--blue); }
.cta-outline:hover { background: var(--blue); color: white; }

/* COPY TOAST */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #0d2144; color: white; padding: 12px 28px; border-radius: 50px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: all .35s; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media(max-width:480px){
  .q-card { padding: 28px 20px; }
  .result-card { padding: 36px 24px; }
  .result-actions { flex-direction: column; align-items: center; }
  .dist-label { width: 56px; font-size: 12px; }
}
</style>

let answers = [];
let current = 0;
let selected = null;

function startGame() {
  document.getElementById('heroSection').style.display = 'none';
  document.getElementById('gameWrap').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  selected = null;
  const btn = document.getElementById('nextBtn');
  btn.classList.remove('active');

  const q = QUESTIONS[current];
  const pct = Math.round((current / QUESTIONS.length) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = 'سؤال ' + (current + 1) + ' من ' + QUESTIONS.length;

  let html = '<div class="q-card">';
  html += '<div class="q-num">السؤال ' + (current + 1) + '</div>';
  html += '<div class="q-text">' + q.text + '</div>';
  html += '<div class="options">';
  q.opts.forEach((o, i) => {
    html += '<div class="opt" onclick="selectOpt(this,' + i + ')" data-idx="' + i + '">';
    html += '<span class="opt-icon">' + o.icon + '</span>';
    html += '<span>' + o.text + '</span>';
    html += '</div>';
  });
  html += '</div></div>';
  document.getElementById('questionArea').innerHTML = html;
  window.scrollTo({top: document.getElementById('gameWrap').offsetTop - 20, behavior: 'smooth'});
}

function selectOpt(el, idx) {
  document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selected = idx;
  document.getElementById('nextBtn').classList.add('active');
}

function nextQuestion() {
  if (selected === null) return;
  answers.push(QUESTIONS[current].opts[selected].el);
  current++;
  if (current < QUESTIONS.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('gameWrap').style.display = 'none';
  const counts = { W: 0, F: 0, E: 0, M: 0, Wa: 0 };
  answers.forEach(a => counts[a]++);
  const winner = Object.entries(counts).sort((a,b) => b[1]-a[1])[0][0];
  const r = RESULTS[winner];
  const total = QUESTIONS.length;

  let distHTML = '';
  const labels = { W: '🌳 خشب', F: '🔥 نار', E: '⛰️ تراب', M: '💎 معدن', Wa: '🌊 ماء' };
  Object.entries(counts).forEach(([k,v]) => {
    const pct = Math.round((v/total)*100);
    distHTML += '<div class="dist-row">';
    distHTML += '<div class="dist-label">' + labels[k] + '</div>';
    distHTML += '<div class="dist-track"><div class="dist-fill" style="width:' + pct + '%"></div></div>';
    distHTML += '<div class="dist-pct">' + pct + '%</div>';
    distHTML += '</div>';
  });

  const shareText = '🌌 اكتشفت أنني روح "' + r.title + '" في اختبار من أنت في الكون؟\n\n"' + r.tagline + '"\n\naكتشف عنصرك: azizasoubai.com/cosmos.html';

  let html = '<div class="result-card ' + r.color + '">';
  html += '<span class="result-emoji">' + r.emoji + '</span>';
  html += '<div class="result-label">' + r.label + '</div>';
  html += '<div class="result-title">' + r.title + '</div>';
  html += '<div class="result-tagline">"' + r.tagline + '"</div>';
  html += '<div class="result-divider"></div>';
  html += '<div class="result-desc">' + r.desc + '</div>';
  html += '<div class="result-traits">';
  r.traits.forEach(t => { html += '<span class="trait">' + t + '</span>'; });
  html += '</div>';
  html += '<div class="dist-wrap"><div class="dist-title">توزيع عناصرك</div>' + distHTML + '</div>';
  html += '<div class="result-actions">';
  html += '<button class="action-btn btn-share" onclick="copyResult(`' + shareText.replace(/`/g,'\\`') + '`)">📋 انسخ نتيجتك</button>';
  html += '<button class="action-btn btn-retry" onclick="retryGame()">🔄 أعد الاختبار</button>';
  html += '</div>';
  html += '</div>';

  html += '<div class="after-card">';
  html += '<h3>اكتشفت عنصرك — ماذا بعد؟</h3>';
  html += '<p>منهج ممكنون يأخذك أعمق — من معرفة من أنت إلى العيش بكامل طاقتك الحقيقية</p>';
  html += '<div class="cta-row">';
  html += '<a href="/minhaj.html" class="cta-a cta-primary">اكتشف المنهج</a>';
  html += '<a href="/game.html" class="cta-a cta-outline">تحديات أخرى</a>';
  html += '</div></div>';

  const wrap = document.getElementById('resultWrap');
  wrap.innerHTML = html;
  wrap.style.display = 'block';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function copyResult(text) {
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  });
}

function retryGame() {
  answers = []; current = 0; selected = null;
  document.getElementById('resultWrap').style.display = 'none';
  document.getElementById('gameWrap').style.display = 'block';
  renderQuestion();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
</script>
</body>
</html>
